spring.application.name=Gateway
server.port=8096

# Eureka : les routes lb:// utilisent les instances inscrites dans le registre.
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# Microservice Candidat
spring.cloud.gateway.server.webmvc.routes[0].id=CANDIDAT
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CANDIDAT
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic1/candidates/**

# Microservice Job
spring.cloud.gateway.server.webmvc.routes[1].id=JOB
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://JOB
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/jobs/**

# Microservice Candidature
spring.cloud.gateway.server.webmvc.routes[2].id=CANDIDATURE
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://CANDITATURE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/mic3/candidature/**

# Microservice Meeting
spring.cloud.gateway.server.webmvc.routes[3].id=MEETING
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://MEETING
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/meetings/**

# Microservice Notification
spring.cloud.gateway.server.webmvc.routes[4].id=NOTIFICATION
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://NOTIFICATION
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet.function=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application information
info.app.name=Gateway
info.app.description=API Gateway Microservices
info.app.version=1.0.0
