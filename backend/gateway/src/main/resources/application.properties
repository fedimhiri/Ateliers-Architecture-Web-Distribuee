
# ==========================================
# 1. CONFIGURATION API GATEWAY
# ==========================================

spring.application.name=gateway
server.port=8093

# ==========================================
# 2. CONNEXION AU SERVEUR EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# 3. ROUTAGE DYNAMIQUE CANDIDAT
# Instances : 8082 et 8087
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=CANDIDAT-DYNAMIC
spring.cloud.gateway.server.webflux.routes[0].uri=lb://candidat
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/candidat/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# ==========================================
# 4. ROUTAGE DYNAMIQUE JOB
# Instance : 8086
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=JOB-DYNAMIC
spring.cloud.gateway.server.webflux.routes[1].uri=lb://job
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/job/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# ==========================================
# 5. ROUTAGE DYNAMIQUE CANDITATURE
# Instance : 8085
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=CANDITATURE-DYNAMIC
spring.cloud.gateway.server.webflux.routes[2].uri=lb://canditature
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/mic3/candidature/**

# ==========================================
# 6. LOGS DE ROUTAGE
# ==========================================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=TRACE
logging.level.reactor.netty.http.client=DEBUG
