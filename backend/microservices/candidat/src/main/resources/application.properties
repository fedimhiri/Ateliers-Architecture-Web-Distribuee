
# ==========================================
# 1. CONFIGURATION DU MICROSERVICE CANDIDAT
# ==========================================

spring.application.name=candidat
server.port=8082

# ==========================================
# 2. BASE DE DONNEES H2 - CONFIGURATION D'ORIGINE
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.datasource.username=Badia
spring.datasource.password=
#spring.datasource.url=jdbc:h2:file:./Database/Data/Candidat
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create

# ==========================================
# 3. SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================
# 4. CONNEXION EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# 5. SPRING BOOT ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true

# ==========================================
# 6. INFORMATIONS DU MICROSERVICE
# ==========================================

management.info.env.enabled=true

info.app.name=candidat
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidats
