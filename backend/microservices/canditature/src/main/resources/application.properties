
# ==========================================
# 1. CONFIGURATION DU MICROSERVICE
# ==========================================

spring.application.name=canditature
server.port=8085

# ==========================================
# 2. CONNEXION AU SERVEUR EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# 3. SPRING BOOT ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Synchroniser le statut de sante avec Eureka
eureka.client.healthcheck.enabled=true

# ==========================================
# 4. INFORMATIONS DU MICROSERVICE
# ==========================================

management.info.env.enabled=true

info.app.name=Canditature
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidatures
