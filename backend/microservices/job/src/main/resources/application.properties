
# ==========================================
# MICROSERVICE JOB
# ==========================================

spring.application.name=job
server.port=8086

# ==========================================
# DATASOURCE - MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Le schema est cree par database/job_db.sql
# Hibernate ne modifie pas les tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================
# EUREKA DISCOVERY CLIENT
# ==========================================

# Adresse du serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enregistrer JOB dans Eureka
eureka.client.register-with-eureka=true

# Recuperer la liste des microservices
eureka.client.fetch-registry=true

# Utiliser l'adresse IP pour l'enregistrement
eureka.instance.prefer-ip-address=true



# ==========================================
# SPRING BOOT ACTUATOR
# ==========================================

# Exposer les endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Afficher les details de sante
management.endpoint.health.show-details=always

# Transmettre la sante du microservice a Eureka
eureka.client.healthcheck.enabled=true

# Activer les informations personnalisees
management.info.env.enabled=true

# Informations JOB
info.app.name=job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
